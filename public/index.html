<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>자원 목록</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">통합 모니터</p>
          <h1>자원 목록</h1>
        </div>
        <button id="refreshBtn" type="button" title="새로고침">새로고침</button>
      </section>

      <section class="controls" aria-label="필터">
        <label>
          <span>검색</span>
          <input id="searchInput" type="search" placeholder="자원명, 기관명, 키워드" autocomplete="off" />
        </label>
        <label>
          <span>출처</span>
          <select id="sourceFilter">
            <option value="all">전체</option>
          </select>
        </label>
      </section>

      <section class="status">
        <div>
          <strong id="countText">불러오는 중</strong>
          <span id="updatedText">잠시만 기다려주세요.</span>
        </div>
        <span id="healthText"></span>
      </section>

      <section id="list" class="list" aria-live="polite"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
